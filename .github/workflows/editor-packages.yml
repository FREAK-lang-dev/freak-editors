name: Editor packages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:
    inputs:
      version:
        description: Version to stamp into the staged editor assets
        required: true
        type: string
      revision:
        description: Immutable freak-editors commit to package
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: FREAK-lang-dev/freak-editors
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select artifact version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          version="${REQUESTED_VERSION:-$(cat VERSION)}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "EDITOR_VERSION=$version" >> "$GITHUB_ENV"
      - run: npm ci
      - run: python -m pip install -r lsp/requirements.txt
      - name: Verify highlighting against the pinned grammar
        run: |
          npm test
          python -u tests/editor_grammars.py --remote
      - name: Build and verify installable editor assets
        run: |
          python -u tools/package_editors.py --version "$EDITOR_VERSION" --output dist/editors
          python -u tests/editor_packages.py --version "$EDITOR_VERSION" --artifacts dist/editors
          python -u tests/lsp_stdio.py "dist/editors/freak-vscode-$EDITOR_VERSION.vsix"
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: editor-packages
          path: dist/editors/
          if-no-files-found: error
